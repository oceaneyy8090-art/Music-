
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ocean Gaze — Particle Lyrics</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Tahoma, sans-serif;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  background: #000;
}

#label {
  position: fixed;
  bottom: 24px;
  left: 0;
  width: 100%;
  text-align: center;
  color: #777f99;
  font: 10px Arial;
  letter-spacing: 7px;
  pointer-events: none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<div id="label">O C E A N   G A Z E</div>

<script>

// ---------- تنظیمات اصلی ----------

const W = 900, H = 900;

const COUNT = 4200;
const SAMPLE = 3;

const GATHER_FRAMES = 145;
const HOLD_FRAMES = 115;
const SCATTER_FRAMES = 85;

const TEXT_SIZE = 42;
const LINE_GAP = 95;

const SEED = 27;

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

const off = document.createElement("canvas");
off.width = W;
off.height = H;

const oc = off.getContext("2d", {
  willReadFrequently: true
});

let particles = [];
let targets = [];

let slide = 0;
let frame = 0;
let state = "gather";
let raf;

const lyrics = [
  [
    "خوردم قسم تا بعد از این",
    "با چشم باز عاشق شوم"
  ],
  [
    "حالا که آمد دیگری",
    "من می‌روم من می‌روم"
  ],
  [
    "خداحافظ خداحافظ"
  ],
  [
    "حالا که دست دیگری",
    "برهم زده دنیای ما"
  ],
  [
    "حالا که برهم می‌خورد",
    "آرامش فردای ما"
  ],
  [
    "خداحافظ خداحافظ"
  ]
];

const COLORS = [
  "#ffffff",
  "#dceaff",
  "#b8d5ff",
  "#e8e5ff",
  "#a9c7ed"
];


// ---------- تصادفی کنترل‌شده ----------

function mulberry(a) {
  return function() {
    a |= 0;
    a = a + 0x6D2B79F5 | 0;

    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const rand = mulberry(SEED);

function random(min, max) {
  return min + (max - min) * rand();
}

function clamp(v, a, b) {
  return Math.max(a, Math.min(b, v));
}

function smooth(a, b, x) {
  x = clamp((x - a) / (b - a), 0, 1);
  return x * x * (3 - 2 * x);
}


// ---------- اندازه صفحه ----------

let DPR = 1;

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);

  cv.width = innerWidth * DPR;
  cv.height = innerHeight * DPR;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

resize();
addEventListener("resize", resize);


// ---------- ساخت شکل نوشته ----------

function makeTextTargets(lines) {

  oc.clearRect(0, 0, W, H);

  oc.fillStyle = "#fff";
  oc.textAlign = "center";
  oc.textBaseline = "middle";
  oc.direction = "rtl";

  const size = lines.length === 1 ? 52 : TEXT_SIZE;

  oc.font = `500 ${size}px Tahoma, Arial, sans-serif`;

  const centerY = H / 2;

  const startY = centerY -
    ((lines.length - 1) * LINE_GAP) / 2;

  lines.forEach((txt, i) => {

    let fontSize = size;

    oc.font = `500 ${fontSize}px Tahoma, Arial, sans-serif`;

    while (oc.measureText(txt).width > W * 0.88 && fontSize > 20) {
      fontSize--;
      oc.font = `500 ${fontSize}px Tahoma, Arial, sans-serif`;
    }

    oc.fillText(txt, W / 2, startY + i * LINE_GAP);

  });

  const data = oc.getImageData(0, 0, W, H).data;

  let points = [];

  for (let y = 0; y < H; y += SAMPLE) {
    for (let x = 0; x < W; x += SAMPLE) {

      const alpha = data[(y * W + x) * 4 + 3];

      if (alpha > 100) {
        points.push({
          x: x + random(-0.6, 0.6),
          y: y + random(-0.6, 0.6)
        });
      }

    }
  }

  if (!points.length) {
    console.error("No text pixels found.");
    return false;
  }

  // پخش یکنواخت ذرات روی حروف

  targets = [];

  for (let i = 0; i < COUNT; i++) {

    const p = points[Math.floor(i * points.length / COUNT)];

    targets.push({
      x: p.x,
      y: p.y
    });

  }

  return true;
}


// ---------- ساخت ذرات ----------

function createParticles() {

  particles = [];

  for (let i = 0; i < COUNT; i++) {

    const angle = random(0, Math.PI * 2);
    const radius = random(200, 650);

    particles.push({

      x: W / 2 + Math.cos(angle) * radius,
      y: H / 2 + Math.sin(angle) * radius,

      sx: 0,
      sy: 0,

      tx: 0,
      ty: 0,

      vx: 0,
      vy: 0,

      size: random(0.65, 1.8),

      speed: random(0.055, 0.105),

      angle: angle,

      swirl: random(0.7, 1.6),

      phase: random(0, 6.28),

      color: COLORS[Math.floor(rand() * COLORS.length)],

      sparkle: rand() > 0.87

    });

  }

}


// ---------- تعیین مقصد ذرات ----------

function assignTargets() {

  if (!makeTextTargets(lyrics[slide])) return;

  particles.forEach((p, i) => {

    const target = targets[i];

    p.sx = p.x;
    p.sy = p.y;

    p.tx = target.x;
    p.ty = target.y;

    // جهت مارپیچی حرکت

    p.angle = Math.atan2(
      p.sy - p.ty,
      p.sx - p.tx
    );

  });

}


// ---------- پخش شدن ذرات ----------

function scatter() {

  particles.forEach(p => {

    const angle = random(0, Math.PI * 2);
    const distance = random(300, 850);

    p.sx = p.x;
    p.sy = p.y;

    p.tx = W / 2 + Math.cos(angle) * distance;
    p.ty = H / 2 + Math.sin(angle) * distance;

    p.tx = clamp(p.tx, -100, W + 100);
    p.ty = clamp(p.ty, -100, H + 100);

    p.angle = angle;

  });

}


// ---------- حرکت مارپیچی ----------

function moveGather(p, progress, time) {

  const dx = p.tx - p.sx;
  const dy = p.ty - p.sy;

  const ease = smooth(0, 1, progress);

  // مسیر منحنی و مارپیچی

  const curve = Math.sin(progress * Math.PI) *
                p.swirl * 45;

  const cx = Math.cos(p.angle + progress * 5) * curve;
  const cy = Math.sin(p.angle + progress * 5) * curve;

  const wave = Math.sin(time * 0.04 + p.phase) *
               2 * (1 - ease);

  const x = p.sx + dx * ease + cx + wave;
  const y = p.sy + dy * ease + cy;

  p.x += (x - p.x) * p.speed;
  p.y += (y - p.y) * p.speed;

}


// ---------- حرکت انفجاری ----------

function moveScatter(p, progress) {

  const ease = smooth(0, 1, progress);

  const dx = p.tx - p.sx;
  const dy = p.ty - p.sy;

  const curl = Math.sin(progress * Math.PI) * 65;

  const x = p.sx + dx * ease +
    Math.cos(p.angle + progress * 7) * curl;

  const y = p.sy + dy * ease +
    Math.sin(p.angle + progress * 7) * curl;

  p.x += (x - p.x) * 0.12;
  p.y += (y - p.y) * 0.12;

}


// ---------- درخشش و رسم ذرات ----------

function drawParticles(time) {

  ctx.clearRect(0, 0, innerWidth, innerHeight);

  const scale = Math.min(
    innerWidth / W,
    innerHeight / H
  );

  const offsetX = (innerWidth - W * scale) / 2;
  const offsetY = (innerHeight - H * scale) / 2;

  ctx.save();

  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  // هاله نور مرکزی

  const glow = ctx.createRadialGradient(
    W / 2, H / 2, 5,
    W / 2, H / 2, 390
  );

  glow.addColorStop(0, "rgba(80,130,200,0.10)");
  glow.addColorStop(1, "rgba(0,0,0,0)");

  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  particles.forEach(p => {

    let twinkle = 0.55 +
      Math.sin(time * 0.055 + p.phase) * 0.35;

    const size = p.size *
      (p.sparkle ? 1 + Math.max(0, twinkle) : 1);

    ctx.globalAlpha = clamp(twinkle, 0.12, 1);

    ctx.fillStyle = p.color;

    ctx.shadowBlur = p.sparkle ? 13 : 7;
    ctx.shadowColor = "#a6ccff";

    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
    ctx.fill();

    // درخشش چهارپر روی بعضی ذرات

    if (p.sparkle && twinkle > 0.65) {

      const z = size * 2.5;

      ctx.globalAlpha = (twinkle - 0.5) * 0.8;

      ctx.fillRect(p.x - z, p.y - 0.35, z * 2, 0.7);
      ctx.fillRect(p.x - 0.35, p.y - z, 0.7, z * 2);

    }

  });

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  ctx.restore();

}


// ---------- کنترل مراحل ----------

function nextSlide() {

  slide++;

  if (slide >= lyrics.length) {
    slide = 0;
  }

  assignTargets();

  state = "gather";
  frame = 0;

}


function animate(time) {

  if (state === "gather") {

    const progress = clamp(frame / GATHER_FRAMES, 0, 1);

    particles.forEach(p => {
      moveGather(p, progress, time);
    });

    if (frame >= GATHER_FRAMES) {
      state = "hold";
      frame = 0;
    }

  }

  else if (state === "hold") {

    // ذرات در جای خود می‌درخشند

    particles.forEach(p => {

      p.x += (p.tx - p.x) * 0.08;
      p.y += (p.ty - p.y) * 0.08;

    });

    if (frame >= HOLD_FRAMES) {

      state = "scatter";
      frame = 0;

      scatter();

    }

  }

  else if (state === "scatter") {

    const progress = clamp(frame / SCATTER_FRAMES, 0, 1);

    particles.forEach(p => {
      moveScatter(p, progress);
    });

    if (frame >= SCATTER_FRAMES) {
      nextSlide();
    }

  }

  drawParticles(time);

  frame++;

  raf = requestAnimationFrame(animate);

}


// ---------- شروع ----------

async function start() {

  if (document.fonts && document.fonts.ready) {
    await document.fonts.ready;
  }

  resize();

  createParticles();

  assignTargets();

  state = "gather";
  frame = 0;

  requestAnimationFrame(animate);

}

start();

</script>
</body>
</html>
