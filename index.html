
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goodbye — Ocean Gaze</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #030914;
  overflow: hidden;
  height: 100vh;
  font-family: Vazirmatn, Tahoma, sans-serif;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

.glow {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at center, #17304c88, transparent 65%),
    radial-gradient(ellipse at bottom, #10243d, transparent 65%);
  pointer-events: none;
}

.brand {
  position: fixed;
  bottom: 28px;
  width: 100%;
  text-align: center;
  color: #7896b7;
  font-size: 10px;
  letter-spacing: 7px;
  opacity: .6;
  z-index: 2;
}

.hint {
  position: fixed;
  top: 25px;
  width: 100%;
  text-align: center;
  color: #647f9e;
  font-size: 10px;
  letter-spacing: 3px;
  z-index: 2;
}
</style>
</head>

<body>
<div class="glow"></div>
<canvas id="canvas"></canvas>
<div class="hint">A STORY WRITTEN IN LIGHT</div>
<div class="brand">O C E A N   G A Z E</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const lyrics = [
  ["خوردم قسم تا بعد از این", "با چشم باز عاشق شوم"],
  ["حالا که آمد دیگری", "من می‌روم من می‌روم"],
  ["خداحافظ خداحافظ"],
  ["حالا که دست دیگری", "برهم زده دنیای ما"],
  ["حالا که برهم می‌خورد", "آرامش فردای ما"],
  ["خداحافظ خداحافظ"]
];

let W, H, DPR;
let particles = [];
let targets = [];
let slide = 0;
let phase = "scatter";
let timer = 0;
let lastTime = 0;
let finished = false;

const PARTICLE_COUNT = 2600;

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth;
  H = innerHeight;

  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  if (particles.length) {
    particles.forEach(p => {
      p.x = Math.random() * W;
      p.y = Math.random() * H;
    });
    makeTargets();
  }
}

function createParticles() {
  particles = [];

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      tx: W / 2,
      ty: H / 2,
      vx: 0,
      vy: 0,
      size: Math.random() * 1.5 + .5,
      speed: Math.random() * .035 + .035,
      phase: Math.random() * 6.28,
      color: Math.random()
    });
  }
}

function makeTargets() {
  const off = document.createElement("canvas");
  off.width = W;
  off.height = H;

  const g = off.getContext("2d");
  g.clearRect(0, 0, W, H);
  g.fillStyle = "#fff";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.direction = "rtl";

  const lines = lyrics[slide];
  const fontSize = Math.min(39, Math.max(22, W * .055));
  const lineGap = fontSize * 2.1;
  const centerY = H / 2;

  g.font = `400 ${fontSize}px Vazirmatn, Tahoma, sans-serif`;

  const startY = centerY - ((lines.length - 1) * lineGap) / 2;

  lines.forEach((line, index) => {
    g.fillText(line, W / 2, startY + index * lineGap);
  });

  const image = g.getImageData(0, 0, W, H).data;
  const points = [];

  const step = W < 500 ? 4 : 5;

  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      const alpha = image[(y * W + x) * 4 + 3];

      if (alpha > 100) {
        points.push({ x, y });
      }
    }
  }

  // پخش کردن نقاط متن میان ذرات
  targets = [];

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const point = points[i % points.length];
    targets.push({
      x: point.x + (Math.random() - .5) * 1.5,
      y: point.y + (Math.random() - .5) * 1.5
    });
  }

  // مرتب‌سازی تصادفی برای طبیعی‌تر شدن حرکت
  for (let i = targets.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [targets[i], targets[j]] = [targets[j], targets[i]];
  }

  particles.forEach((p, i) => {
    p.tx = targets[i].x;
    p.ty = targets[i].y;
  });
}

function scatter() {
  particles.forEach(p => {
    p.tx = Math.random() * W;
    p.ty = Math.random() * H;
  });
}

function nextSlide() {
  slide++;

  if (slide >= lyrics.length) {
    finished = true;
    return;
  }

  makeTargets();
  phase = "gather";
  timer = 0;
}

function drawBackground() {
  ctx.fillStyle = "rgba(3, 9, 20, 0.28)";
  ctx.fillRect(0, 0, W, H);

  // مه نورانی مرکزی
  const gradient = ctx.createRadialGradient(
    W / 2, H / 2, 0,
    W / 2, H / 2, Math.min(W, H) * .55
  );

  gradient.addColorStop(0, "rgba(35, 85, 130, .10)");
  gradient.addColorStop(1, "rgba(3, 9, 20, 0)");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);
}

function drawParticles(time) {
  particles.forEach(p => {
    const dx = p.tx - p.x;
    const dy = p.ty - p.y;

    p.x += dx * p.speed;
    p.y += dy * p.speed;

    const shimmer = .55 + Math.sin(time * .002 + p.phase) * .35;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);

    ctx.fillStyle = p.color > .8
      ? `rgba(220,240,255,${shimmer})`
      : `rgba(115,177,230,${shimmer})`;

    ctx.shadowBlur = 10;
    ctx.shadowColor = "#70baff";
    ctx.fill();
  });

  ctx.shadowBlur = 0;
}

function loop(time) {
  const dt = Math.min(40, time - (lastTime || time));
  lastTime = time;

  drawBackground();
  drawParticles(time);

  timer += dt;

  if (phase === "gather" && timer > 4800) {
    phase = "hold";
    timer = 0;
  }

  if (phase === "hold" && timer > 3300) {
    phase = "scatter";
    timer = 0;
    scatter();
  }

  if (phase === "scatter" && timer > 1800) {
    if (slide === lyrics.length - 1) {
      // آخرین خداحافظ برای چند لحظه باقی می‌ماند
      phase = "final";
      timer = 0;
    } else {
      nextSlide();
    }
  }

  if (phase === "final" && timer > 9000) {
    slide = 0;
    finished = false;
    makeTargets();
    phase = "gather";
    timer = 0;
  }

  requestAnimationFrame(loop);
}

async function start() {
  await document.fonts.ready;
  resize();
  createParticles();
  makeTargets();

  phase = "gather";
  requestAnimationFrame(loop);
}

window.addEventListener("resize", resize);
start();
</script>
</body>
</html>
