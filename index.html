
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ocean Gaze | Goodbye</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #030914;
}

body {
  font-family: Tahoma, sans-serif;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

#background {
  z-index: 0;
}

#particles {
  z-index: 1;
}

.brand {
  position: fixed;
  z-index: 2;
  bottom: 28px;
  width: 100%;
  text-align: center;
  color: #8ba9c9;
  font: 10px Arial;
  letter-spacing: 7px;
  opacity: .65;
}

</style>
</head>

<body>

<canvas id="background"></canvas>
<canvas id="particles"></canvas>

<div class="brand">O C E A N   G A Z E</div>

<script>
const bg = document.getElementById("background");
const canvas = document.getElementById("particles");

const bctx = bg.getContext("2d");
const ctx = canvas.getContext("2d");

const lyrics = [
  ["خوردم قسم تا بعد از این", "با چشم باز عاشق شوم"],
  ["حالا که آمد دیگری", "من می‌روم من می‌روم"],
  ["خداحافظ خداحافظ"],
  ["حالا که دست دیگری", "برهم زده دنیای ما"],
  ["حالا که برهم می‌خورد", "آرامش فردای ما"],
  ["خداحافظ خداحافظ"]
];

let W, H, DPR;
let particles = [];
let targets = [];
let slide = 0;

let state = "gather";
let stateTime = 0;
let previousTime = 0;

const COUNT = 2200;

function resize() {
  W = innerWidth;
  H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);

  [bg, canvas].forEach(c => {
    c.width = W * DPR;
    c.height = H * DPR;
    c.style.width = W + "px";
    c.style.height = H + "px";
    c.getContext("2d").setTransform(DPR, 0, 0, DPR, 0, 0);
  });

  drawBackground();

  if (particles.length) {
    makeTargets();
  }
}

function drawBackground() {
  const gradient = bctx.createRadialGradient(
    W / 2, H / 2, 5,
    W / 2, H / 2, Math.max(W, H) * .75
  );

  gradient.addColorStop(0, "#142c46");
  gradient.addColorStop(.5, "#081526");
  gradient.addColorStop(1, "#02050d");

  bctx.fillStyle = gradient;
  bctx.fillRect(0, 0, W, H);

  // ستاره‌های پس‌زمینه
  for (let i = 0; i < 130; i++) {
    const x = (i * 173.7) % W;
    const y = (i * 97.3) % H;
    const r = (i % 3) * .35 + .3;

    bctx.beginPath();
    bctx.arc(x, y, r, 0, Math.PI * 2);
    bctx.fillStyle = "rgba(190,220,255,.45)";
    bctx.fill();
  }
}


// ساخت ذرات اولیه
function createParticles() {
  particles = [];

  for (let i = 0; i < COUNT; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      tx: W / 2,
      ty: H / 2,
      vx: 0,
      vy: 0,
      size: Math.random() * 1.3 + .6,
      speed: .075 + Math.random() * .055,
      phase: Math.random() * Math.PI * 2,
      shade: Math.random()
    });
  }
}


// تبدیل متن فارسی به نقاط واقعی حروف
function makeTargets() {
  const off = document.createElement("canvas");
  off.width = W;
  off.height = H;

  const octx = off.getContext("2d", {
    willReadFrequently: true
  });

  octx.clearRect(0, 0, W, H);
  octx.fillStyle = "#ffffff";
  octx.direction = "rtl";
  octx.textAlign = "center";
  octx.textBaseline = "middle";

  const lines = lyrics[slide];
  const baseSize = Math.min(42, Math.max(23, W * .058));
  const gap = baseSize * 2.05;
  const centerY = H * .48;
  const startY = centerY - ((lines.length - 1) * gap) / 2;

  lines.forEach((txt, i) => {
    let size = baseSize;

    octx.font = `${size}px Tahoma, Arial, sans-serif`;

    // کوچک کردن متن در صورت نیاز
    while (octx.measureText(txt).width > W * .90 && size > 16) {
      size -= 1;
      octx.font = `${size}px Tahoma, Arial, sans-serif`;
    }

    octx.fillText(txt, W / 2, startY + i * gap);
  });

  const data = octx.getImageData(0, 0, W, H).data;
  const points = [];

  // نمونه‌برداری از پیکسل‌های روشن حروف
  for (let y = 0; y < H; y += 3) {
    for (let x = 0; x < W; x += 3) {
      const index = (y * W + x) * 4;
      if (data[index + 3] > 90) {
        points.push({ x, y });
      }
    }
  }

  // اگر فونت یا متن به هر دلیلی رسم نشد
  if (points.length < 20) {
    console.error("Text pixels not found. Check the browser font.");
    return false;
  }

  // انتخاب نقاط متناسب با تعداد ذرات
  targets = [];

  for (let i = 0; i < COUNT; i++) {
    const p = points[Math.floor(i * points.length / COUNT) % points.length];

    targets.push({
      x: p.x + (Math.random() - .5) * 1.2,
      y: p.y + (Math.random() - .5) * 1.2
    });
  }

  // جابه‌جایی تصادفی ترتیب هدف‌ها
  for (let i = targets.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [targets[i], targets[j]] = [targets[j], targets[i]];
  }

  particles.forEach((p, i) => {
    p.tx = targets[i].x;
    p.ty = targets[i].y;
  });

  return true;
}


// پخش شدن ذرات
function explodeParticles() {
  particles.forEach(p => {
    const angle = Math.random() * Math.PI * 2;
    const distance = Math.max(W, H) * (.45 + Math.random() * .7);

    p.tx = W / 2 + Math.cos(angle) * distance;
    p.ty = H / 2 + Math.sin(angle) * distance;

    // ذرات از لبه خارج نشوند
    p.tx = Math.max(-30, Math.min(W + 30, p.tx));
    p.ty = Math.max(-30, Math.min(H + 30, p.ty));
  });
}


// رسم ذرات
function drawParticles(time) {
  ctx.clearRect(0, 0, W, H);

  particles.forEach(p => {
    const dx = p.tx - p.x;
    const dy = p.ty - p.y;

    // حرکت نرم و فنری
    p.vx += dx * .012;
    p.vy += dy * .012;

    p.vx *= .78;
    p.vy *= .78;

    p.x += p.vx;
    p.y += p.vy;

    const glow = .65 + Math.sin(time * .003 + p.phase) * .3;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);

    if (p.shade > .88) {
      ctx.fillStyle = `rgba(240,248,255,${glow})`;
    } else {
      ctx.fillStyle = `rgba(112,180,240,${glow})`;
    }

    ctx.shadowBlur = 9;
    ctx.shadowColor = "#80caff";
    ctx.fill();
  });

  ctx.shadowBlur = 0;
}


// تغییر مصرع‌ها
function nextSlide() {
  slide++;

  if (slide >= lyrics.length) {
    slide = 0;
  }

  makeTargets();
  state = "gather";
  stateTime = 0;
}


// حلقه اصلی انیمیشن
function animate(time) {
  const delta = Math.min(time - (previousTime || time), 40);
  previousTime = time;

  stateTime += delta;

  drawParticles(time);

  if (state === "gather" && stateTime > 3200) {
    state = "hold";
    stateTime = 0;
  }

  else if (state === "hold" && stateTime > 3000) {
    state = "scatter";
    stateTime = 0;
    explodeParticles();
  }

  else if (state === "scatter" && stateTime > 1800) {
    nextSlide();
  }

  requestAnimationFrame(animate);
}


// شروع
async function start() {
  resize();
  createParticles();

  // کمی فرصت برای آماده شدن فونت مرورگر
  if (document.fonts && document.fonts.ready) {
    await document.fonts.ready;
  }

  makeTargets();
  requestAnimationFrame(animate);
}

window.addEventListener("resize", resize);

start();

</script>
</body>
</html>
