<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>خداحافظ</title>
<style>
:root{--ink:#f6d9e0;--wine:#5a0f26;--line:#6b1830;--rose:#ff7aa8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:Vazirmatn,Tahoma,"Noto Naskh Arabic","Segoe UI",sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
#gear{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;z-index:5;opacity:.7}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:4;max-height:66vh;overflow:auto;background:rgba(14,3,6,.95);border-top:1px solid var(--line);padding:12px 14px calc(16px + env(safe-area-inset-bottom));transition:transform .35s ease}
#panel.hide{transform:translateY(105%)}
.b,button{background:var(--wine);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font:inherit;font-size:14px;cursor:pointer}
.b:active,button:active{background:#7d1634}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.r{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
audio{width:100%;height:40px;margin:2px 0 10px;color-scheme:dark}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px;font-size:13px}
.g label{display:flex;flex-direction:column;gap:4px}
input,select{background:#1a0509;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:14px;accent-color:#c4143c}
input[type=range]{padding:0}
#tm{font-size:13px;color:#d98aa6;margin:6px 0}
.row{display:grid;grid-template-columns:22px 1fr 64px 64px auto;gap:6px;align-items:center;padding:5px 0;border-top:1px solid #2a0a14;font-size:13px}
.row input{width:100%;direction:ltr;text-align:center}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .k{display:flex;gap:4px}
.row button{padding:5px 8px;font-size:13px}
h3{font-size:14px;font-weight:600;margin:12px 0 4px;color:#e79ab5}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="gear" class="b">⚙ تنظیمات</button>

<div id="panel">
  <div class="r">
    <label class="b">🎵 انتخاب آهنگ<input type="file" id="fAud" accept="audio/*" hidden></label>
    <button id="bGo">▶ شروع</button>
    <button id="bRe">⏮ از اول</button>
  </div>
  <audio id="audio" controls preload="auto"></audio>
  <div class="g">
    <label>ذرات متن: <b id="vT">1800</b><input type="range" id="nT" min="600" max="3500" step="100" value="1800"></label>
    <label>تعداد پروانه: <b id="vB">12</b><input type="range" id="nB" min="0" max="24" step="1" value="12"></label>
    <label>نرخ فریم
      <select id="fps"><option value="30">۳۰ (کم‌مصرف)</option><option value="45">۴۵</option><option value="60">۶۰</option></select></label>
  </div>
  <div id="tm">زمان فعلی: ۰٫۰ ثانیه</div>
  <h3>زمان‌بندی متن (ثانیه)</h3>
  <div class="r">
    <button id="bAuto">توزیع خودکار روی طول آهنگ</button>
    <button id="bReset">بازنشانی زمان‌ها</button>
  </div>
  <div id="rows"></div>
</div>

<script>
(function(){
"use strict";
const LINES=["خوردم قسم تا بعد از این","با چشم باز عاشق شوم","حالا که آمد دیگری","من میروم من میروم","خدا حافظ خدا حافظ","حالا که دست دیگری","برهم زده دنیای ما","حالا که برهم می خورد","آرامش فردای ما","خدا حافظ خدا حافظ"];
const FONT='Vazirmatn,Tahoma,"Noto Naskh Arabic","Segoe UI",sans-serif';
const KEY="kh_timing_v1";
const $=s=>document.querySelector(s);
const cv=$("#cv"),ctx=cv.getContext("2d"),audio=$("#audio"),panel=$("#panel");
const coarse=matchMedia("(pointer:coarse)").matches;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ease=q=>q<.5?4*q*q*q:1-Math.pow(-2*q+2,3)/2;
const rnd=(a,b)=>a+Math.random()*(b-a);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
$("#fps").value=coarse?"30":"60";
if(coarse){$("#nB").value=9;$("#vB").textContent=9;$("#nT").value=1500;$("#vT").textContent=1500}

const S={pool:[],tc:[],cur:-2,W:0,H:0,dpr:1,hasAudio:false,running:false,preview:0,nt:0,tsz:2,fps:coarse?30:60,B:[],E:[]};

/* ---------- timings ---------- */
const dflt=()=>LINES.map((_,i)=>({s:24+i*24,e:24+i*24+20}));
let TIM=dflt();
try{const j=JSON.parse(localStorage.getItem(KEY)||"null");if(j&&j.length===LINES.length)TIM=j}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(TIM))}catch(e){}}
function curT(){return S.hasAudio?audio.currentTime:S.preview}
function seek(t){if(S.hasAudio)audio.currentTime=t;else S.preview=t}
const rowsEl=$("#rows");
function buildRows(){
  rowsEl.innerHTML="";
  LINES.forEach((txt,i)=>{
    const d=document.createElement("div");d.className="row";
    d.innerHTML='<span>'+(i+1)+'</span><span class="t"></span><input type="number" step="0.1" min="0" inputmode="decimal"><input type="number" step="0.1" min="0" inputmode="decimal"><span class="k"><button title="ثبت شروع از زمان فعلی">⏱</button><button title="ثبت پایان از زمان فعلی">⏹</button><button title="پخش از این خط">▶</button></span>';
    d.querySelector(".t").textContent=txt;
    const [a,b]=d.querySelectorAll("input"),[k1,k2,k3]=d.querySelectorAll("button");
    a.value=TIM[i].s.toFixed(1);b.value=TIM[i].e.toFixed(1);
    a.oninput=()=>{TIM[i].s=Math.max(0,parseFloat(a.value)||0);save()};
    b.oninput=()=>{TIM[i].e=Math.max(0,parseFloat(b.value)||0);save()};
    k1.onclick=()=>{TIM[i].s=curT();a.value=TIM[i].s.toFixed(1);save()};
    k2.onclick=()=>{TIM[i].e=curT();b.value=TIM[i].e.toFixed(1);save()};
    k3.onclick=()=>{seek(Math.max(0,TIM[i].s-.3));play()};
    rowsEl.appendChild(d);
  });
}
$("#bAuto").onclick=()=>{
  const dur=(isFinite(audio.duration)&&audio.duration>0)?audio.duration:240,a0=dur*.08,per=(dur*.86)/LINES.length;
  TIM=LINES.map((_,i)=>({s:+(a0+i*per).toFixed(1),e:+(a0+i*per+per*.85).toFixed(1)}));save();buildRows();
};
$("#bReset").onclick=()=>{TIM=dflt();save();buildRows()};

/* ---------- sprites ---------- */
function glowSprite(rgb){
  const c=document.createElement("canvas");c.width=c.height=48;const x=c.getContext("2d");
  const g=x.createRadialGradient(24,24,0,24,24,24);
  g.addColorStop(0,"rgba("+rgb+",.95)");g.addColorStop(.35,"rgba("+rgb+",.28)");g.addColorStop(1,"rgba("+rgb+",0)");
  x.fillStyle=g;x.fillRect(0,0,48,48);return c;
}
const GP=glowSprite("255,70,120"),GW=glowSprite("255,180,190");

/* ---------- butterfly (wing curves from the reference) ---------- */
const UPPER=[[[0,0],[5.8,15.5],[21.5,38],[37.5,40]],[[37.5,40],[38.5,28.5],[31,3.5],[23,0]],[[23,0],[15,0.7],[5.5,-0.1],[0,0]]];
const LOWER=[[[0,0],[6.5,-0.1],[17,0.8],[23.5,-1.4]],[[23.5,-1.4],[25,-10.5],[17,-30],[10.5,-30]],[[10.5,-30],[4.5,-29],[0.8,-9],[0,0]]];
const COUNTS=[12,26,12],KS=2.2,OY=Math.ceil(42*KS)+2;
function cubic(p0,p1,p2,p3,u){const v=1-u;return[v*v*v*p0[0]+3*v*v*u*p1[0]+3*v*u*u*p2[0]+u*u*u*p3[0],v*v*v*p0[1]+3*v*v*u*p1[1]+3*v*u*u*p2[1]+u*u*u*p3[1]]}
function makeSprite(rgb,seed){
  const r=mul(seed),c=document.createElement("canvas");c.width=Math.ceil(40*KS)+4;c.height=Math.ceil(72*KS)+4;
  const x=c.getContext("2d"),P=p=>[1+p[0]*KS,OY-p[1]*KS];
  for(const set of [UPPER,LOWER]){
    x.fillStyle="rgba(20,3,10,.9)";x.beginPath();
    set.forEach((s,i)=>{for(let k=i?1:0;k<=40;k++){const q=P(cubic(s[0],s[1],s[2],s[3],k/40));(i===0&&k===0)?x.moveTo(q[0],q[1]):x.lineTo(q[0],q[1])}});
    x.closePath();x.fill();
    set.forEach((s,i)=>{
      for(let k=1;k<=COUNTS[i];k++){
        const e=cubic(s[0],s[1],s[2],s[3],k/COUNTS[i]),dx=e[0],dy=e[1],bend=(Math.abs(dy)*.04+Math.abs(dx)*.02);
        const c1=[dx*.24+bend*.2,dy*.34],c2=[dx*.72+bend,dy*.82],sh=.35+r()*.65;
        x.strokeStyle="rgba("+(rgb[0]*sh|0)+","+(rgb[1]*sh|0)+","+(rgb[2]*sh|0)+",.95)";x.lineWidth=.9;x.beginPath();
        for(let j=0;j<=10;j++){const q=P(cubic([0,0],c1,c2,e,j/10));j?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])}
        x.stroke();
      }
      x.strokeStyle="rgb("+Math.min(255,rgb[0]+30)+","+Math.min(255,rgb[1]+50)+","+Math.min(255,rgb[2]+50)+")";x.lineWidth=1.3;x.beginPath();
      for(let k=0;k<=40;k++){const q=P(cubic(s[0],s[1],s[2],s[3],k/40));k?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])}
      x.stroke();
    });
  }
  x.fillStyle="#ffe3ea";
  for(let i=0;i<30;i++){const q=P(cubic(...UPPER[1],r()));x.globalAlpha=.4+r()*.5;x.fillRect(q[0]-1-r()*10,q[1]+r()*14,1.4,1.4)}
  return c;
}
const SPR=[makeSprite([255,105,150],3),makeSprite([235,40,85],7),makeSprite([255,185,200],11)];
function buildButterflies(){
  const n=+$("#nB").value,r=mul(99);S.B=[];
  for(let i=0;i<n;i++)S.B.push({sp:SPR[i%3],rx:.28+r()*.2,ry:.1+r()*.22,wx:.14+r()*.22,wy:.17+r()*.26,px:r()*6.28,py:r()*6.28,fs:7+r()*4,fp:r()*6.28,span:.05+r()*.04});
}
function drawB(b,t){
  const W=S.W,H=S.H,P=tt=>[W/2+b.rx*W*Math.sin(b.wx*tt+b.px)+b.rx*W*.18*Math.sin(b.wx*2.7*tt+b.px*2),H/2+b.ry*H*Math.sin(b.wy*tt+b.py)+b.ry*H*.2*Math.cos(b.wy*3.1*tt)];
  const p=P(t),q=P(t+.06),ang=Math.atan2(q[1]-p[1],q[0]-p[0])+Math.PI/2;
  const span=Math.max(26*S.dpr,Math.min(W,H*1.2)*b.span),s=span/(76*KS),f=.34+.66*(.5+.5*Math.cos(t*b.fs+b.fp));
  ctx.save();ctx.translate(p[0],p[1]);
  ctx.globalCompositeOperation="lighter";ctx.globalAlpha=.3*S.bfa;const g=span*.75;ctx.drawImage(GP,-g,-g,g*2,g*2);
  ctx.globalCompositeOperation="source-over";ctx.globalAlpha=S.bfa;ctx.rotate(ang);ctx.scale(s,s);
  for(const sd of [1,-1]){ctx.save();ctx.scale(sd*f,1);ctx.drawImage(b.sp,0,-OY);ctx.restore()}
  ctx.fillStyle="#ffd2dc";ctx.beginPath();ctx.ellipse(0,0,2.6,11,0,0,6.283);ctx.fill();
  ctx.restore();
}

/* ---------- embers ---------- */
function buildEmbers(){S.E=[];for(let i=0;i<(coarse?40:80);i++)S.E.push({x:Math.random(),y:Math.random(),v:rnd(.01,.035),r:rnd(.8,2.2),ph:Math.random()*6.28})}
function drawEmbers(t,dt){
  for(const e of S.E){
    e.y-=e.v*dt;if(e.y<-.02){e.y=1.02;e.x=Math.random()}
    const x=(e.x+Math.sin(t*.4+e.ph)*.01)*S.W,y=e.y*S.H,a=.25+.25*Math.sin(t*1.3+e.ph);
    ctx.globalAlpha=a;ctx.fillStyle="#b3173f";const z=e.r*S.dpr;ctx.fillRect(x,y,z,z);
  }
  ctx.globalAlpha=1;
}

/* ---------- text ---------- */
const STOPS=[[176,16,58],[255,40,75],[255,125,170]];
function pal(u){u=clamp(u,0,1)*2;const i=Math.min(1,u|0),f=u-i,a=STOPS[i],b=STOPS[i+1];return"rgb("+(a[0]+(b[0]-a[0])*f|0)+","+(a[1]+(b[1]-a[1])*f|0)+","+(a[2]+(b[2]-a[2])*f|0)+")"}
function buildPool(){
  const M=+$("#nT").value;S.pool=[];
  for(let i=0;i<M;i++)S.pool.push({col:"#f33",d:0,sw:rnd(-.5,.5),ph:Math.random()*6.283,ax:0,ay:0,bx:0,by:0,tx:0,ty:0,gl:i%5===0});
}
function textPoints(i){
  if(S.tc[i])return S.tc[i];
  const W=S.W,H=S.H,M=S.pool.length,str=LINES[i],c=document.createElement("canvas"),x=c.getContext("2d",{willReadFrequently:true});
  const F=s=>"700 "+s+"px "+FONT;
  const base=Math.min(H*.1,W*.13);let fs=base,lines=[str];x.font=F(fs);
  const w1=()=>x.measureText(lines[0]).width;
  while(w1()>W*.88&&fs>base*.62){fs-=2;x.font=F(fs)}
  if(w1()>W*.88){
    const w=str.split(" "),h=Math.ceil(w.length/2);lines=[w.slice(0,h).join(" "),w.slice(h).join(" ")];
    fs=base;x.font=F(fs);
    const mw=()=>Math.max(...lines.map(l=>x.measureText(l).width));
    while(mw()>W*.88&&fs>10){fs-=2;x.font=F(fs)}
  }
  const lh=fs*1.5,th=Math.ceil(lh*lines.length+fs*.4);c.width=W;c.height=th;
  x.font=F(fs);x.direction="rtl";x.textAlign="center";x.textBaseline="middle";x.fillStyle="#fff";
  lines.forEach((l,k)=>x.fillText(l,W/2,fs*.2+lh*(k+.5)));
  const d=x.getImageData(0,0,W,th).data,top=H*.5-th/2;
  let step=Math.max(2,Math.round(fs/30)),pts;
  for(;;){
    pts=[];
    for(let y=0;y<th;y+=step)for(let xx=0;xx<W;xx+=step){
      const jx=Math.min(W-1,xx+Math.random()*step*.55),jy=Math.min(th-1,y+Math.random()*step*.55);
      if(d[((jy|0)*W+(jx|0))*4+3]>110)pts.push({x:jx,y:jy+top});
    }
    if(pts.length<=M||step>60)break;step++;
  }
  shuffle(pts);if(pts.length>M)pts.length=M;
  return S.tc[i]={pts,sz:Math.max(1.5*S.dpr,step*.8)};
}
const DM=.5;
function assign(i){
  const {pts,sz}=textPoints(i),W=S.W;S.nt=pts.length;S.tsz=sz;
  for(let k=0;k<pts.length;k++){
    const p=S.pool[k],q=pts[k],a=Math.random()*6.283,r=rnd(.05,.4)*W,a2=Math.random()*6.283,r2=rnd(40,160)*S.dpr;
    p.tx=q.x;p.ty=q.y;p.ax=q.x+Math.cos(a)*r;p.ay=q.y+Math.sin(a)*r*.8;
    p.bx=q.x+Math.cos(a2)*r2;p.by=q.y+Math.sin(a2)*r2-rnd(20,120)*S.dpr;
    p.d=DM*(.65*(1-q.x/W)+.35*Math.random());
    p.col=pal(q.x/W*.6+Math.random()*.4);
  }
}
function drawText(t,time){
  let idx=-1,bs=-1;
  for(let i=0;i<TIM.length;i++){const a=TIM[i];if(t>=a.s&&t<a.e&&a.s>=bs){idx=i;bs=a.s}}
  if(idx!==S.cur){S.cur=idx;if(idx>=0)assign(idx)}
  if(idx<0)return;
  const a=TIM[idx],dur=a.e-a.s,IN=Math.min(3.2,dur*.55),OUT=Math.min(2,dur*.35),fin=t-a.s,fout=a.e-t;
  const sz=S.tsz,h=sz/2,glow=[],fl=.5*S.dpr,K=1+DM;
  for(let k=0;k<S.nt;k++){
    const p=S.pool[k],f=clamp(fin/IN*K-p.d,0,1),o=clamp((OUT-fout)/OUT*K-p.d,0,1);
    if(f<=0)continue;
    const e=ease(f),dx=p.tx-p.ax,dy=p.ty-p.ay,s=Math.sin(Math.PI*f)*p.sw;
    let x=p.ax+dx*e-dy*s*.5,y=p.ay+dy*e+dx*s*.5;
    if(f===1&&o===0){x+=Math.sin(time*.0018+p.ph)*fl;y+=Math.cos(time*.002+p.ph)*fl}
    if(o>0){const eo=ease(o);x+=(p.bx-x)*eo;y+=(p.by-y)*eo}
    const al=Math.min(1,f*3)*(1-o);
    ctx.globalAlpha=al;ctx.fillStyle=p.col;ctx.fillRect(x-h,y-h,sz,sz);
    if(p.gl&&al>.05)glow.push(x,y,al);
  }
  if(glow.length){
    ctx.globalCompositeOperation="lighter";const g=sz*3.4;
    for(let i=0;i<glow.length;i+=3){ctx.globalAlpha=.17*glow[i+2]*(.8+.2*Math.sin(time*.003+i));ctx.drawImage(GP,glow[i]-g,glow[i+1]-g,g*2,g*2)}
    ctx.globalCompositeOperation="source-over";
  }
  ctx.globalAlpha=1;
}

/* ---------- main loop ---------- */
S.bfa=0;let last=0,lblT=0;
function resize(){
  S.dpr=Math.min(window.devicePixelRatio||1,coarse?1.5:2);
  S.W=cv.width=Math.max(2,Math.round(innerWidth*S.dpr));
  S.H=cv.height=Math.max(2,Math.round(innerHeight*S.dpr));
  S.tc=[];S.cur=-2;buildPool();
}
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(resize,150)});
addEventListener("orientationchange",()=>setTimeout(resize,250));
function loop(ts){
  requestAnimationFrame(loop);
  if(ts-last<1000/S.fps-2)return;
  const dt=Math.min(ts-last,100)/1000;last=ts;
  if(S.running&&!S.hasAudio)S.preview+=dt;
  S.bfa=Math.min(1,S.bfa+dt*.4);
  ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";ctx.fillStyle="#000";ctx.fillRect(0,0,S.W,S.H);
  const t=curT();
  if(ts-lblT>250){lblT=ts;$("#tm").textContent="زمان فعلی: "+t.toFixed(1)+" ثانیه"}
  drawEmbers(ts*.001,dt);
  for(const b of S.B)drawB(b,ts*.001);
  drawText(t,ts);
}

/* ---------- controls ---------- */
function isPlaying(){return S.hasAudio?!audio.paused&&!audio.ended:S.running}
function upd(){$("#bGo").textContent=isPlaying()?"⏸ توقف":"▶ شروع"}
function play(){
  if(S.hasAudio){const p=audio.play();if(p&&p.catch)p.catch(()=>{})}else S.running=true;
  panel.classList.add("hide");upd();
}
function stop(){if(S.hasAudio)audio.pause();else S.running=false;upd()}
$("#bGo").onclick=()=>{isPlaying()?stop():play()};
$("#bRe").onclick=()=>{seek(0);S.cur=-2;play()};
$("#gear").onclick=()=>panel.classList.toggle("hide");
["play","pause","ended","seeked"].forEach(ev=>audio.addEventListener(ev,upd));
cv.addEventListener("click",()=>panel.classList.add("hide"));
$("#fAud").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  if(S.hasAudio)URL.revokeObjectURL(audio.src);
  audio.src=URL.createObjectURL(f);S.hasAudio=true;S.running=false;audio.load();upd();
};
$("#nT").oninput=e=>$("#vT").textContent=e.target.value;
$("#nT").onchange=()=>{buildPool();S.tc=[];S.cur=-2};
$("#nB").oninput=e=>$("#vB").textContent=e.target.value;
$("#nB").onchange=buildButterflies;
$("#fps").onchange=e=>S.fps=+e.target.value;

buildRows();buildButterflies();buildEmbers();resize();upd();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
