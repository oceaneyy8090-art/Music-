
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hayedeh | Particle Memories</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  overflow:hidden;
  background:#080308;
  color:white;
  font-family:Tahoma,sans-serif;
}
canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}
#panel{
  position:fixed;
  z-index:5;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  align-items:center;
}
button,.filelabel{
  background:#5b102d;
  border:1px solid #ff719d;
  color:#fff;
  padding:10px 14px;
  border-radius:20px;
  font-size:12px;
  cursor:pointer;
}
input{display:none}
#hint{
  position:fixed;
  bottom:15px;
  width:100%;
  text-align:center;
  color:#ff9bb9;
  font-size:11px;
  opacity:.7;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="panel">
  <label class="filelabel" for="photo">انتخاب عکس هایده</label>
  <input id="photo" type="file" accept="image/*">
  <button id="start">شروع انیمیشن</button>
</div>

<div id="hint">A memory made of particles ♥</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W,H,dpr;
let portrait=[];
let textParticles=[];
let photoReady=false;
let started=false;
let startTime=0;
let image=new Image();

const lyrics=[
"قسم خوردم تا بعد از این",
"عاشق نشم",
"حالا که آمد دیگری",
"من میروم من میروم",
"خدا حافظ",
"خدا حافظ",
"حالا که دست دیگری",
"برهم زده دنیای ما",
"حالا که برهم می خورد",
"آرامش فردای ما",
"خدا حافظ",
"خدا حافظ"
];

function resize(){
  W=innerWidth;
  H=innerHeight;
  dpr=Math.min(devicePixelRatio||1,1);
  canvas.width=W*dpr;
  canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(photoReady) makePortrait();
}
addEventListener("resize",resize);
resize();

document.getElementById("photo").addEventListener("change",e=>{
  const file=e.target.files[0];
  if(!file)return;
  const url=URL.createObjectURL(file);
  image.onload=()=>{
    photoReady=true;
    makePortrait();
    URL.revokeObjectURL(url);
  };
  image.src=url;
});

function makePortrait(){
  portrait=[];
  const off=document.createElement("canvas");
  const o=off.getContext("2d");

  const maxW=Math.min(W*.78,430);
  const maxH=H*.65;
  const scale=Math.min(maxW/image.width,maxH/image.height);
  const iw=image.width*scale;
  const ih=image.height*scale;

  off.width=Math.max(1,Math.floor(iw));
  off.height=Math.max(1,Math.floor(ih));

  o.drawImage(image,0,0,off.width,off.height);
  const data=o.getImageData(0,0,off.width,off.height).data;

  const ox=(W-iw)/2;
  const oy=(H-ih)/2-25;

  for(let y=0;y<off.height;y+=3){
    for(let x=0;x<off.width;x+=3){
      const i=(y*off.width+x)*4;
      if(data[i+3]<80)continue;

      portrait.push({
        x:ox+x,
        y:oy+y,
        color:`rgb(${data[i]},${data[i+1]},${data[i+2]})`,
        sx:Math.random()*W,
        sy:Math.random()*H,
        delay:Math.random()*5000,
        size:Math.random()*1.2+.5
      });
    }
  }
}

function makeText(text){
  textParticles=[];
  const off=document.createElement("canvas");
  const o=off.getContext("2d");

  off.width=Math.min(W*.9,700);
  off.height=110;

  o.direction="rtl";
  o.textAlign="center";
  o.textBaseline="middle";
  o.font="bold  thirtypx Tahoma";
  o.font="bold 30px Tahoma";
  o.fillStyle="white";
  o.fillText(text,off.width/2,55);

  const data=o.getImageData(0,0,off.width,off.height).data;
  const ox=(W-off.width)/2;
  const oy=H*.77-55;

  for(let y=0;y<off.height;y+=3){
    for(let x=0;x<off.width;x+=3){
      const i=(y*off.width+x)*4;
      if(data[i+3]>100){
        textParticles.push({
          x:ox+x,y:oy+y,
          sx:Math.random()*W,
          sy:Math.random()*H,
          delay:Math.random()*500,
          size:Math.random()*1.5+.7
        });
      }
    }
  }
}

function drawPortrait(t){
  if(!photoReady)return;

  for(const p of portrait){
    const progress=Math.max(0,Math.min(1,(t-p.delay)/6500));
    const ease=1-Math.pow(1-progress,3);

    const x=p.sx+(p.x-p.sx)*ease;
    const y=p.sy+(p.y-p.sy)*ease;

    ctx.globalAlpha=.2+ease*.8;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(x,y,p.size,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawText(t){
  const lineDuration=4300;
  const index=Math.floor(t/lineDuration);
  if(index>=lyrics.length)return;

  const local=t%lineDuration;
  const appear=Math.min(1,local/900);
  const disappear=local>3200?Math.max(0,1-(local-3200)/800):1;
  const alpha=appear*disappear;

  if(drawText.current!==index){
    makeText(lyrics[index]);
    drawText.current=index;
  }

  for(const p of textParticles){
    const x=p.sx+(p.x-p.sx)*Math.min(1,local/650);
    const y=p.sy+(p.y-p.sy)*Math.min(1,local/650);

    ctx.globalAlpha=alpha;
    ctx.fillStyle=Math.random()>.5?"#ff477e":"#ffabc5";
    ctx.beginPath();
    ctx.arc(x,y,p.size,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}
drawText.current=-1;

function animate(now){
  requestAnimationFrame(animate);
  if(!started)return;

  const t=now-startTime;
  ctx.clearRect(0,0,W,H);

  drawPortrait(t);
  drawText(t);

  if(t>lyrics.length*4300){
    started=false;
  }
}
requestAnimationFrame(animate);

document.getElementById("start").onclick=()=>{
  if(!photoReady){
    alert("اول عکس هایده رو انتخاب کن");
    return;
  }
  started=true;
  startTime=performance.now();
  drawText.current=-1;
};
</script>
</body>
</html>
